<form
  hx-post="{{ action_url }}"
  hx-target="#modal-container"
  hx-swap="innerHTML"
  hx-disabled-elt="find button[type=submit]"
  enctype="multipart/form-data"
  novalidate
>
  <c-layout.modal-body :title="page_title" width="{{ modal_width|default:'lg' }}">
    {% include "app/crud/form-fields.html" %}
    <c-slot name="footer">{% include "app/crud/form-buttons.html" %}</c-slot>
  </c-layout.modal-body>
</form>
