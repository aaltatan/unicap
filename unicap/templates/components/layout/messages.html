<!-- toasts: full pages render queued messages here; HTMX responses append out of band -->
<div
  id="messages"
  class="print:hidden pointer-events-none fixed bottom-4 end-4 z-[70] flex w-96 max-w-[calc(100vw-2rem)] flex-col gap-2"
  aria-live="polite"
>
  {% for message in messages %}
  <c-layout.toast :message="message" />
  {% endfor %}
</div>
