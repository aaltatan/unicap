{% load i18n %}
<c-vars
  :icons="{'success': 'check-circle', 'error': 'exclamation-circle', 'warning': 'exclamation-triangle', 'info': 'information-circle', 'debug': 'information-circle'}"
  :colors="{'success': 'text-emerald-500', 'error': 'text-rose-500', 'warning': 'text-amber-500', 'info': 'text-indigo-500', 'debug': 'text-neutral-500'}"
/>
<div
  x-data="toast('{{ message.level_tag }}')"
  x-show="show"
  x-transition:enter="transition duration-200 ease-out"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:leave="transition duration-150 ease-in"
  x-transition:leave-end="opacity-0"
  class="card pointer-events-auto flex items-start gap-2 p-3 text-sm shadow-lg"
  role="status"
>
  <span class="{{ colors|get_item:message.level_tag }} shrink-0">{% heroicon_outline icons|get_item:message.level_tag size=20 %}</span>
  <p class="flex-1 first-letter:uppercase">{{ message }}</p>
  <button type="button" class="btn btn-ghost btn-icon -m-1" @click="show = false" aria-label="{% translate 'close' %}">
    {% heroicon_outline "x-mark" size=16 %}
  </button>
</div>
